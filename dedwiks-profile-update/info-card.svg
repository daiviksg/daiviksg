  </style>

  <rect x="0" y="0" width="490" height="266" rx="8" ry="8" fill="#010409" stroke="#30363d" />

  <!-- title bar -->
  <rect x="0" y="0" width="490" height="34" rx="8" ry="8" fill="#0d1117" />
  <rect x="0" y="20" width="490" height="14" fill="#0d1117" />
  <circle cx="20" cy="17" r="5" fill="#ff5f56" />
  <circle cx="38" cy="17" r="5" fill="#ffbd2e" />
  <circle cx="56" cy="17" r="5" fill="#27c93f" />
