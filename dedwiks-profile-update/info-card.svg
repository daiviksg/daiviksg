<svg xmlns="http://www.w3.org/2000/svg" width="490" height="266"
     viewBox="0 0 490 266"
     font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13">
  <style>
    .line {
      opacity: 0;
      transform: translateX(-8px);
      animation: line-in 0.4s ease-out forwards;
    }
    @keyframes line-in {
      to { opacity: 1; transform: translateX(0); }
    }
    .title { fill: #c9d1d9; font-weight: 600; }
    .prompt-muted { fill: #8b949e; }
